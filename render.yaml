services:
  - type: web
    name: eduapp-backend
    env: python
    rootDir: apps/backend
    buildCommand: pip install -r requirements.txt || pip install -r pyproject.toml || true
    startCommand: ./start.sh
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: eduapp-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_ORIGIN
        value: https://<din-vercel-app>.vercel.app  # oppdater etter Vercel-deploy
    autoDeploy: true
databases:
  - name: eduapp-db
    databaseName: eduapp
    user: edu
